<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Join the Magic | Register - Bubble Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3B82F6', cyan: '#22D3EE', purple: '#8B5CF6', dark: '#0F172A' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Premium Design System - Standard CSS to remove IDE warnings */
        :root {
            --primary: #3B82F6;
            --cyan: #22D3EE;
            --purple: #8B5CF6;
            --dark: #0F172A;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(to right, var(--primary), var(--cyan), var(--purple));
            color: white;
            border-radius: 9999px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(34, 211, 238, 0.3);
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(34, 211, 238, 0.4);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: inherit;
            border-radius: 9999px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            padding: 2rem;
            transition: all 0.5s ease;
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .nav-sticky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            transition: all 0.3s ease;
            padding: 1.5rem 0;
        }

        .nav-sticky.scrolled {
            padding: 0.75rem 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .nav-sticky.scrolled {
            background: rgba(15, 23, 42, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark text-slate-800 dark:text-white min-h-screen flex items-center justify-center p-6 py-20">
    <!-- Top Right Controls -->
    <div class="fixed top-6 right-6 flex items-center gap-4 z-50">
        <button onclick="toggleTheme()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/10">
            <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
            <svg class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
        </button>
        <button onclick="document.documentElement.dir = document.documentElement.dir === 'rtl' ? 'ltr' : 'rtl'" class="font-bold text-xs px-4 py-2 rounded-full bg-white/10 dark:bg-white/20 hover:bg-white/30 transition-all uppercase tracking-wider border border-white/10">RTL</button>
    </div>

    <div class="w-full max-w-lg relative z-10">
        <div class="glass-card p-10 border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 backdrop-blur-2xl shadow-xl shadow-slate-200/70 dark:shadow-none">
            <div class="text-center mb-10">
                <a href="index.html" aria-label="Go to homepage" class="flex items-center justify-center gap-2 group mb-4 transition-all">
                <div class="relative w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-tr from-primary via-cyan to-purple rounded-full blur-sm opacity-40 group-hover:opacity-100 transition-opacity"></div>
                    <svg class="w-6 h-6 sm:w-8 h-8 relative z-10" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="url(#bubble-grad-auth)" stroke-width="1.5"/>
                        <path d="M15 8.5C15 8.5 14.5 7.5 13 7.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <defs><linearGradient id="bubble-grad-auth" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
                    </svg>
                </div>
                <span class="text-xl sm:text-2xl font-black bg-gradient-to-r from-primary via-cyan to-purple bg-clip-text text-transparent font-poppins tracking-tight">BUBBLE<span class="text-slate-800 dark:text-white transition-colors">MAGIC</span></span>
            </a>
                <h2 class="text-2xl font-bold">Create Your Magic Account</h2>
                <p class="opacity-60">Join our circle for faster bookings and exclusive updates.</p>
            </div>
            <form class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest opacity-60 mb-2">First Name</label>
                    <input type="text" placeholder="John" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-2xl px-6 py-3 outline-none focus:ring-2 ring-primary transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest opacity-60 mb-2">Last Name</label>
                    <input type="text" placeholder="Doe" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-2xl px-6 py-3 outline-none focus:ring-2 ring-primary transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest opacity-60 mb-2">Email Address</label>
                    <input type="email" placeholder="john@example.com" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-2xl px-6 py-3 outline-none focus:ring-2 ring-primary transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest opacity-60 mb-2">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-2xl px-6 py-3 outline-none focus:ring-2 ring-primary transition-all">
                </div>
                
                <div class="flex items-start gap-3 py-2">
                    <input type="checkbox" id="terms" class="mt-1 w-5 h-5 rounded border-none bg-white/10 text-primary">
                    <label for="terms" class="text-sm opacity-60">I agree to the <a href="#" class="text-cyan underline">Terms of Service</a> and <a href="#" class="text-cyan underline">Privacy Policy</a>.</label>
                </div>

                <button type="submit" class="btn-primary w-full py-4 font-bold shadow-xl shadow-primary/20">Create Account</button>
            </form>
            
            <div class="mt-8">
                <div class="relative mb-8">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-white/10"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-dark px-4 text-slate-400 dark:text-white/40">Or continue with</span></div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <button class="flex justify-center items-center py-3 px-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-200 dark:hover:bg-white/10 transition-all group">
                        <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    </button>
                    <button class="flex justify-center items-center py-3 px-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-200 dark:hover:bg-white/10 transition-all group">
                        <svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </button>
                    <button class="flex justify-center items-center py-3 px-4 rounded-2xl bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-200 dark:hover:bg-white/10 transition-all group">
                        <svg class="w-5 h-5 text-slate-900 dark:text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M19.57 12.27c-.03-3.12 2.55-4.62 2.67-4.69-1.46-2.14-3.73-2.43-4.54-2.46-1.93-.2-3.77 1.14-4.75 1.14-.98 0-2.49-1.11-4.09-1.08-2.1.03-4.05 1.22-5.13 3.1-2.19 3.8-.56 9.43 1.57 12.5 1.04 1.5 2.28 3.19 3.9 3.13 1.56-.06 2.15-1 4.04-1 1.89 0 2.43 1 4.08.97 1.69-.03 2.76-1.52 3.79-3.03 1.19-1.74 1.68-3.42 1.71-3.51-.04-.01-3.27-1.25-3.3-4.97zM16.42 3.06c.86-1.05 1.45-2.5 1.29-3.96-1.24.05-2.74.83-3.63 1.88-.79.91-1.48 2.37-1.3 3.77 1.38.11 2.78-.7 3.64-1.69z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="mt-8 text-center text-sm opacity-60 whitespace-nowrap">
                Already have an account? <a href="login.html" class="text-cyan font-bold hover:underline">Login here</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
